# Deploy ABC Bank to Cloudflare (Worker + static SPA) on
# every push to main, or manually from the Actions tab.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit
# on the account in artifacts/cloudflare-edge/wrangler.jsonc).
# The app has no runtime secrets.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let a running one finish.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck Worker
        run: pnpm --filter @workspace/cloudflare-edge run typecheck

      # Builds the SPA, then deploys the Worker and its static assets.
      - name: Deploy
        run: pnpm --filter @workspace/cloudflare-edge run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
