openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: statements
    description: Synthetic statement document generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /statements/pdf:
    post:
      operationId: generateStatementPdf
      tags: [statements]
      summary: Generate a synthetic PDF bank statement
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/StatementPdfInput"
      responses:
        "200":
          description: Generated PDF statement
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid statement data
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StatementPdfInput:
      type: object
      properties:
        payload:
          type: string
          description: JSON-encoded fictional statement dataset
      required:
        - payload

